name: todo_app
description: Focusd - Advanced To-Do List App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.0.0

  # HTTP & API
  dio: ^5.4.0

  # Local storage
  hive_flutter: ^1.1.0

  # UI components
  table_calendar: ^3.0.9
  fl_chart: ^0.68.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # DI
  get_it: ^7.6.7

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  connectivity_plus: ^6.0.2

  # Fonts
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^1.1.3
  build_runner: ^2.4.8
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  # If you are using google_fonts, you can remove local font files.
  # Uncomment and update paths only when these files exist in your project.
  # fonts:
  #   - family: DM Sans
  #     fonts:
  #       - asset: assets/fonts/DMSans-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/DMSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/DMSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/DMSans-Bold.ttf
  #         weight: 700

  # Uncomment assets only when assets/images and assets/icons exist.
  # assets:
  #   - assets/images/
  #   - assets/icons/
